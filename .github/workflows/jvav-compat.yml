name: Jvav compatibility tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Jvav and test runner
        run: python -m pip install --upgrade pip Jvav==3.0.0 pytest
      - name: Run compatibility tests
        run: python -m pytest -q tests/test_jvav_compat.py
